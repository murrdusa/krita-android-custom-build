name: Krita Android custom build (experimental)

# Android builds run incrementally on the user's WSL build watcher.
# GitHub remains an opt-in fallback and must not launch Android builds on push.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate, preflight headers, compile native UI, or build APK"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - preflight
          - compile
          - build

permissions:
  contents: read

jobs:
  krita:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out customization repository
        uses: actions/checkout@v4

      - name: Check script syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools
          test -f mobile_studio/include/mobile_studio/tablet_compact_skin.h
          bash -n build-in-krita-container.sh local-build.sh

      - name: Reclaim disk space
        if: ${{ inputs.mode == 'build' || inputs.mode == 'compile' || inputs.mode == 'preflight' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[android-build]') || contains(github.event.head_commit.message, '[android-compile]') || contains(github.event.head_commit.message, '[android-preflight]'))) }}
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache || true
          docker system prune --all --force || true
          df -h /

      - name: Clone official source and apply patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/krita-custom-android-build"
          mkdir -p "$ROOT/persistent"
          git clone --depth 1 --branch v6.0.4 https://github.com/KDE/krita.git "$ROOT/persistent/krita"
          python3 tools/patches/apply_all.py "$ROOT/persistent/krita"
          python3 -c 'import hashlib, pathlib; p=pathlib.Path.home()/"krita-custom-android-build/persistent/krita"; xml=(p/"krita/krita5.xmlgui").read_text(); cmake=(p/"krita/CMakeLists.txt").read_text(); actual=hashlib.md5("".join(xml.split()).encode()).hexdigest(); expected=next(s.split(chr(34))[1] for s in cmake.splitlines() if "set(krita5_xmlgui_hash_expected" in s); assert actual==expected, f"XMLGUI checksum mismatch: {actual} != {expected}"; print(f"XMLGUI checksum validated: {actual}")'
          git -C "$ROOT/persistent/krita" diff --check
          git -C "$ROOT/persistent/krita" diff --stat
          cp build-in-krita-container.sh "$ROOT/persistent/krita/build-in-krita-container.sh"
          touch "$ROOT/persistent/krita/.krita_android_custom_patch_applied"

      - name: Validation result (NOT an APK build)
        if: inputs.mode == 'validate' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[android-build]') && !contains(github.event.head_commit.message, '[android-compile]') && !contains(github.event.head_commit.message, '[android-preflight]'))
        run: echo "Patch applied and diff checked. Android compilation has NOT been tested."

      - name: Download KDE Android build support
        if: ${{ inputs.mode == 'build' || inputs.mode == 'compile' || inputs.mode == 'preflight' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[android-build]') || contains(github.event.head_commit.message, '[android-compile]') || contains(github.event.head_commit.message, '[android-preflight]'))) }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/krita-custom-android-build"
          SRC="$ROOT/persistent/krita"
          git clone --depth 1 https://invent.kde.org/dkazakov/krita-docker-env.git "$ROOT/docker-env-staging"
          cp -a "$ROOT/docker-env-staging/." "$ROOT/"
          rm -rf "$ROOT/docker-env-staging"
          git clone --depth 1 https://invent.kde.org/packaging/krita-deps-management.git "$SRC/krita-deps-management"
          git clone --depth 1 https://invent.kde.org/packaging/krita-ci-utilities.git "$SRC/krita-deps-management/ci-utilities"
          cd "$ROOT"
          ./bin/bootstrap-krita-deps.sh --android=arm64-v8a
          df -h /

      - name: Compile native Krita UI or debug APK in KDE container
        if: ${{ inputs.mode == 'build' || inputs.mode == 'compile' || inputs.mode == 'preflight' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[android-build]') || contains(github.event.head_commit.message, '[android-compile]') || contains(github.event.head_commit.message, '[android-preflight]'))) }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/krita-custom-android-build"
          cd "$ROOT"
          docker info >/dev/null
          ./bin/build_image --android
          ./bin/run_container
          test -s .container_name
          CONTAINER_NAME="$(head -1 .container_name | tr -d '\r\n')"
          test -n "$CONTAINER_NAME"
          # Native compile mode checks the Krita engine without creating
          # or automatically uploading an Android APK.
          COMPILE_ONLY=0
          PREFLIGHT_ONLY=0
          if [[ "${{ inputs.mode }}" == "preflight" || "${{ contains(github.event.head_commit.message, '[android-preflight]') }}" == "true" ]]; then
            COMPILE_ONLY=1
            PREFLIGHT_ONLY=1
          elif [[ "${{ inputs.mode }}" == "compile" || "${{ contains(github.event.head_commit.message, '[android-compile]') }}" == "true" ]]; then
            COMPILE_ONLY=1
          fi
          docker exec -i -e KRITA_COMPILE_ONLY="$COMPILE_ONLY" -e KRITA_NATIVE_PREFLIGHT_ONLY="$PREFLIGHT_ONLY" -u appimage "$CONTAINER_NAME" bash -lc 'bash "$HOME/persistent/krita/build-in-krita-container.sh"'

      - name: Upload APK artifact when available
        if: ${{ always() && (inputs.mode == 'build' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[android-build]'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: krita-android-experimental-debug-apk
          path: ~/krita-custom-android-build/persistent/krita-custom-apks/*.apk
          if-no-files-found: warn
          retention-days: 7
