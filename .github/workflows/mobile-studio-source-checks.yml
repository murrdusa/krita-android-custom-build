name: Mobile Studio source safety checks

# Source-only validation: never builds or publishes Android APKs.
on:
  push:
    paths:
      - "apk_size_report.py"
      - "krita_build_reporter.py"
      - "krita_build_cache.py"
      - "apply_mobile_shell.py"
      - "apply_finger_contact_pressure.py"
      - "apply_finger_raw_motion.py"
      - "mobile_core/**"
      - "tests/**"
      - ".github/workflows/mobile-studio-source-checks.yml"
  pull_request:
    paths:
      - "apk_size_report.py"
      - "krita_build_reporter.py"
      - "krita_build_cache.py"
      - "apply_mobile_shell.py"
      - "apply_finger_contact_pressure.py"
      - "apply_finger_raw_motion.py"
      - "mobile_core/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m py_compile apk_size_report.py krita_build_reporter.py krita_build_cache.py apply_mobile_shell.py apply_finger_contact_pressure.py apply_finger_raw_motion.py
      - name: Test APK size reporting
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check canvas ownership boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          transfer = Path("mobile_core/canvas_transfer.h").read_text()
          surface = Path("mobile_core/canvas_surface.h").read_text()
          for forbidden in ('"standalone_host.h"', '"engine_bridge.h"',
                            "MobileStandaloneWindow", "KisMainWindow", "KisDocument"):
              assert forbidden not in transfer, f"Canvas transfer leaked {forbidden}"
              assert forbidden not in surface, f"Canvas surface leaked {forbidden}"
          assert '#include <QMdiArea>' not in transfer
          assert "QPointer<QWidget> m_documents" in transfer
          assert "refreshDocumentRoot(" in transfer
          assert '#include <QMdiArea>' not in Path("mobile_core/canvas_session.h").read_text()
          assert "m_backend->centralWidget()!=m_mobileWindow" in transfer
          assert "m_backend->setCentralWidget(mobile)" in transfer
          assert "mobile->setParent(m_backend,Qt::Widget)" in transfer
          assert "m_backend->hide()" not in transfer
          assert "showFullScreen()" not in transfer
          assert "detachNativeCanvas(m_backend)" in transfer
          assert "bool leave()" in transfer
          assert "m_persistentRequestedAtStartup" in transfer
          assert 'm_backend->setProperty("_mobileStudioPresentationActive",false)' in transfer
          assert 'm_backend->setProperty("_mobileStudioCanvasTransferred",true)' in transfer
          assert 'property("_mobileStudioPresentationActive").toBool()' in Path("apply_mobile_shell.py").read_text()
          document_service = Path("mobile_core/document_service.h").read_text()
          command_service = Path("mobile_core/command_service.h").read_text()
          desktop_adapters = Path("mobile_core/desktop_host_adapters.h").read_text()
          mobile_bridge = Path("mobile_core/engine_bridge.h").read_text()
          shell_patch = Path("apply_mobile_shell.py").read_text()
          # There must be exactly one isolated desktop-Krita integration
          # adapter, not KisMainWindow calls scattered through the app.
          for name, source in (("document",document_service),
                               ("command",command_service),
                               ("facade",mobile_bridge)):
              assert '#include "KisMainWindow.h"' not in source, f"{name} directly includes desktop host"
              assert "KisMainWindow *" not in source, f"{name} still takes a desktop window"
              assert "m_mainWindow" not in source, f"{name} still stores a desktop window"
          assert '#include "KisMainWindow.h"' in desktop_adapters
          assert "MobileDesktopDocumentHost" in desktop_adapters
          assert "MobileDesktopCommandRegistry" in desktop_adapters
          assert "MobileDocumentHostPort" in document_service
          assert "MobileCommandRegistryPort" in command_service
          assert "MobileEngineBridge(" in mobile_bridge
          host_bundle = Path("mobile_core/host_services.h").read_text()
          assert "struct MobileHostServices final" in host_bundle
          assert "QPointer<QWidget> documentRoot" in host_bundle
          assert "bool ready() const" in host_bundle
          assert "MobileDesktopEngineBootstrap::create(" in shell_patch
          assert "new MobileDesktopDocumentHost(window)" in desktop_adapters
          assert "new MobileDesktopCommandRegistry(window)" in desktop_adapters
          assert "new MobileMdiViewHostAdapter(documentRoot,manager)" in desktop_adapters
          assert "MobileEngineBridge(mobileServices,d->viewManager)" in shell_patch
          assert 'host_services=own/"mobile_core/host_services.h"' in shell_patch
          assert '(root/"libs/ui/host_services.h").write_text(' in shell_patch
          switcher = Path("mobile_core/document_switcher.h").read_text()
          view_port = Path("mobile_core/view_host_port.h").read_text()
          view_guard = Path("mobile_core/view_identity_guard.h").read_text()
          mdi_adapter = Path("mobile_core/mdi_view_host_adapter.h").read_text()
          assert "MobileViewHostPort" in view_port
          assert "MobileViewIdentityGuard::maySave(" in document_service
          assert "MobileViewIdentityGuard::safeCloseTarget(" in document_service
          assert "MobileViewIdentityGuard::byIndex(" in document_service
          assert "MobileMdiViewIdentity::resolve" in mdi_adapter
          assert "selected>=0" in mdi_adapter
          assert "if(candidate>=0)" in mdi_adapter
          assert "QPointer<QMdiArea> m_area" in mdi_adapter
          assert "currentDocument() const override" in mdi_adapter
          assert "currentDocument() const = 0;" in view_port
          assert '#include <QMdiArea>' not in document_service
          assert "m_documents" not in document_service
          assert "m_manager" not in document_service
          assert '#include "KisViewManager.h"' not in document_service
          assert "m_viewHost->currentDocument()" in document_service
          assert "subWindowList(" not in document_service
          assert "KisView.h" not in document_service
          assert '#include <QMdiArea>' not in mobile_bridge
          assert "new MobileMdiViewHostAdapter(documentRoot,manager)" in desktop_adapters
          assert 'view_guard=own/"mobile_core/view_identity_guard.h"' in shell_patch
          assert '(root/"libs/ui/view_identity_guard.h").write_text(' in shell_patch
          assert "closeDocumentView(activeView)" in switcher
          assert "activateDocumentView(desiredView)" in switcher
          mobile_shell = Path("mobile_core/standalone_host.h").read_text()
          quick_actions = Path("mobile_core/quick_actions.h").read_text()
          assert "m_engine.closeActiveDocument()" not in mobile_shell
          assert "closeDocumentView(document.nativeView)" in mobile_shell
          assert 'id==QStringLiteral("mobile:close")' in quick_actions
          assert "m_transfer.leave()" in Path("mobile_core/canvas_session.h").read_text()
          assert "MobileStudio/fingerContactPressureV1" in Path("mobile_core/standalone_host.h").read_text()
          pressure_settings = Path("mobile_core/finger_pressure_settings.h").read_text()
          assert "minPressure() {return 0.0;}" in pressure_settings
          assert "maxPressure() {return 1.0;}" in pressure_settings
          pressure_input = Path("mobile_core/finger_contact_pressure.h").read_text()
          assert "MobileFingerPressureSettings::mapDiameter(" in pressure_input
          assert "stroke.smoothed=target;" in pressure_input
          assert "finger_pressure_settings.h" in pressure_input
          assert "MobileFingerPressureSettings::adaptiveAlpha(" in pressure_input
          assert "MobileFingerRawBridge::nearest(" in pressure_input
          assert "MobileFingerContactSource::select(" in pressure_input
          assert "finger_contact_source.h" in pressure_input
          assert "finger_contact_source.h" in Path("apply_finger_contact_pressure.py").read_text()
          pressure_ui = Path("mobile_core/finger_pressure_calibration.h").read_text()
          assert "fingerPressureCurveGamma" in pressure_ui
          assert "fingerPressureStability" in pressure_ui
          assert "fingerPressureLevels" in pressure_ui
          raw_patch = Path("apply_finger_raw_motion.py").read_text()
          assert "dispatchTouchEvent(MotionEvent event)" in raw_patch
          assert "getHistoricalTouchMajor" in raw_patch
          assert "return super.dispatchTouchEvent(event)" in raw_patch
          native_chrome = Path("mobile_core/native_canvas_chrome.h").read_text()
          assert "class MobileNativeCanvasChrome" in native_chrome
          assert "m_backend->centralWidget()==m_nativeCanvas" in native_chrome
          assert "takeCentralWidget(" not in native_chrome
          assert "setCentralWidget(" not in native_chrome
          assert "m_nativeCanvas->setParent(" not in native_chrome
          assert "Qt::RightDockWidgetArea" in native_chrome
          assert "m_topDock->setMaximumHeight(76)" in native_chrome
          assert "header->setMaximumHeight(68)" in Path("mobile_core/native_canvas_pilot.h").read_text()
          lightweight = Path("mobile_core/lightweight_canvas_host.h").read_text()
          for prohibited in ("KisMainWindow", "QMdiArea", "KisViewManager", "KisDocument"):
              assert prohibited not in lightweight.replace("KisMainWindow, QMdiArea, or Krita UI types.", ""), prohibited
          assert "bool installNativeCanvas(QWidget *canvas)" in lightweight
          assert "bool attachServices(const MobileHostServices &services)" in lightweight
          assert "bool setMobileVisible(bool enabled)" in lightweight
          assert "retainsOriginalCanvas()" in lightweight
          native_stack = Path("mobile_core/native_view_stack.h").read_text()
          assert "class MobileNativeViewStack final" in native_stack
          assert "MobileViewHostPort" in native_stack
          assert "QStackedWidget" in native_stack
          assert '#include <QMdiArea>' not in native_stack
          assert "bool adoptView(" in native_stack
          assert "bool closeView(" in native_stack
          assert "QScopedValueRollback<bool>" in native_stack
          assert 'native_view_stack=own/"mobile_core/native_view_stack.h"' in shell_patch
          assert '(root/"libs/ui/native_view_stack.h").write_text(' in shell_patch
          assert "captureAdditionalDesktopChrome()" in native_chrome
          assert "captureAdditionalTabs()" in native_chrome
          assert "setBottomPanelVisible(bool visible)" in native_chrome
          assert "placeSidePanelForViewport()" in native_chrome
          assert "Qt::BottomDockWidgetArea" in native_chrome
          pilot = Path("mobile_core/native_canvas_pilot.h").read_text()
          for component in ("MobileNativeCanvasChrome", "MobileQuickActions",
                            "KritaMobileBrushWorkspace", "KritaMobileLayersPanel",
                            "MobileColorWorkspace", "MobileDocumentSwitcher"):
              assert component in pilot, f"Native stationary pilot missing {component}"
          assert "setCentralWidget(" not in pilot
          assert "takeCentralWidget(" not in pilot
          assert "m_nativeCanvas->setParent(" not in pilot
          assert "QPointer<QObject> selectedView;" in pilot
          assert "m_engine.closeDocumentView(selectedView)" in pilot
          assert "m_chrome.setBottomPanelVisible(has)" in pilot
          assert "m_chrome.sidePanelAtBottom()" in pilot
          assert 'id==QStringLiteral("mobile:commands")' in pilot
          assert "return activeCount==1;" in quick_actions
          session = Path("mobile_core/canvas_session.h").read_text()
          assert '#include "native_canvas_pilot.h"' in session
          assert "new MobileNativeCanvasPilot" in session
          assert "MobileStudio/nativeDockCanvasV1" in session
          assert "if(m_nativeCanvasMode)" in session
          assert "m_nativePilot && !m_nativePilot->ready()" in session
          assert "MobileAndroidBackPolicy::mayDismiss(" in session
          assert "qApp->installEventFilter(this)" in session
          assert "activeModalWidget()" in session
          assert "activePopupWidget()" in session
          assert "Qt::Key_Escape" not in session
          assert "dismissTransientControls()" in Path("mobile_core/native_canvas_pilot.h").read_text()
          assert "dismissTransientControls()" in Path("mobile_core/standalone_host.h").read_text()
          raw_bridge = Path("mobile_core/finger_raw_bridge.h").read_text()
          assert "static void reset()" in raw_bridge
          assert "static bool captureEnabled(quint64 uptimeMs)" in raw_bridge
          raw_patch = Path("apply_finger_raw_motion.py").read_text()
          assert "fingerRawGestureReset" in raw_patch
          assert "fingerRawCaptureEnabled" in raw_patch
          assert "return super.dispatchTouchEvent(event);" in raw_patch
          assert "MobileStudio/nativeDockCanvasV1" in Path("mobile_core/standalone_host.h").read_text()
          assert "_mobileStudioPresentationActive" in Path("apply_mobile_shell.py").read_text()
          print("Canvas ownership, opt-in stationary pilot and finger pressure invariants intact")
          PY

  qt-canvas-host-test:
    # This runs the real Qt-only transfer code offscreen on Linux.
    # No Krita engine, Android emulator, APK, or publishing credentials.
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets development headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qtbase5-dev pkg-config
      - name: Build Qt-only canvas transfer smoke test
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_canvas_transfer_smoke.cpp \
            -o /tmp/krita-canvas-transfer-smoke \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Exercise native canvas handoffs offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-canvas-transfer-smoke
      - name: Compile canvas handoffs without a desktop MDI document stack
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_widget_document_root.cpp \
            -o /tmp/krita-widget-document-root-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify native canvas identity with generic QWidget document root
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-widget-document-root-test
      - name: Build independent lightweight Qt painting canvas host
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_lightweight_canvas_host.cpp \
            -o /tmp/krita-lightweight-canvas-host-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Test independent host lifecycle without desktop Krita
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-lightweight-canvas-host-test
      - name: Build MDI-free native multi-document view host
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_native_view_stack.cpp \
            -o /tmp/krita-native-view-stack-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify view lifecycle and twelve canvas-preserving UI switches
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-native-view-stack-test
      - name: Build no-reparent mobile chrome smoke test
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_native_canvas_chrome.cpp \
            -o /tmp/krita-native-canvas-chrome-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify 25 chrome-only mode switches without canvas movement
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-native-canvas-chrome-test
      - name: Build guarded Android Back key routing test
        run: |
          c++ -std=c++17 -fPIC -I. \
            tests/qt_android_back_policy.cpp \
            -o /tmp/krita-android-back-policy-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Test Back key popup/modal and Android focused child safety
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-android-back-policy-test
      - name: Build host-neutral document view lifecycle test
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_view_host_port.cpp \
            -o /tmp/krita-mobile-view-host-test \
            $(pkg-config --cflags --libs Qt5Core)
      - name: Verify view identity, safe Save and native close delegation
        run: /tmp/krita-mobile-view-host-test
      - name: Build engine-host-independent document and action port test
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_mobile_backend_ports.cpp \
            -o /tmp/krita-mobile-backend-ports-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify new host can provide native document and action behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-mobile-backend-ports-test
      - name: Build guarded MDI view identity test
        run: |
          c++ -std=c++17 -fPIC -I. \
            tests/qt_mdi_view_identity.cpp \
            -o /tmp/krita-mdi-identity-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify document view identity under reordering and deletion
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-mdi-identity-test
      - name: Build optional finger pressure mapping test
        run: |
          c++ -std=c++17 -fPIC -I. \
            tests/qt_finger_contact_pressure.cpp \
            -o /tmp/krita-finger-area-pressure-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify finger mapping, smoothing and original-pressure fallback
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-finger-area-pressure-test
      - name: Compile Qt/raw finger source-switch regression
        run: |
          c++ -std=c++17 -fPIC -I. \
            tests/qt_finger_contact_source.cpp \
            -o /tmp/krita-finger-source-test \
            $(pkg-config --cflags --libs Qt5Core)
      - name: Verify raw contact dropouts do not change brush pressure scale
        run: /tmp/krita-finger-source-test
      - name: Compile raw Android contact Qt-only regression
        run: |
          c++ -std=c++17 -fPIC -I. \
            tests/qt_finger_raw_bridge.cpp \
            -o /tmp/krita-finger-raw-bridge-test \
            $(pkg-config --cflags --libs Qt5Core)
      - name: Test raw size, history, finger identity and stale-sample rejection
        run: /tmp/krita-finger-raw-bridge-test
      - name: Build min/max finger calibration dialog smoke test
        run: |
          c++ -std=c++17 -fPIC -I. \
            tests/qt_finger_pressure_calibration.cpp \
            -o /tmp/krita-finger-calibration-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Check calibration ranges and persistence offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-finger-calibration-test
