name: Mobile Studio source safety checks

# Source-only validation: never builds or publishes Android APKs.
on:
  push:
    paths:
      - "apk_size_report.py"
      - "krita_build_reporter.py"
      - "krita_build_cache.py"
      - "apply_mobile_shell.py"
      - "apply_finger_contact_pressure.py"
      - "mobile_core/**"
      - "tests/**"
      - ".github/workflows/mobile-studio-source-checks.yml"
  pull_request:
    paths:
      - "apk_size_report.py"
      - "krita_build_reporter.py"
      - "krita_build_cache.py"
      - "apply_mobile_shell.py"
      - "apply_finger_contact_pressure.py"
      - "mobile_core/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m py_compile apk_size_report.py krita_build_reporter.py krita_build_cache.py apply_mobile_shell.py apply_finger_contact_pressure.py
      - name: Test APK size reporting
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check canvas ownership boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          transfer = Path("mobile_core/canvas_transfer.h").read_text()
          surface = Path("mobile_core/canvas_surface.h").read_text()
          for forbidden in ('"standalone_host.h"', '"engine_bridge.h"',
                            "MobileStandaloneWindow", "KisMainWindow", "KisDocument"):
              assert forbidden not in transfer, f"Canvas transfer leaked {forbidden}"
              assert forbidden not in surface, f"Canvas surface leaked {forbidden}"
          assert "m_backend->centralWidget()!=m_mobileWindow" in transfer
          assert "m_backend->setCentralWidget(mobile)" in transfer
          assert "mobile->setParent(m_backend,Qt::Widget)" in transfer
          assert "m_backend->hide()" not in transfer
          assert "showFullScreen()" not in transfer
          assert "detachNativeCanvas(m_backend)" in transfer
          assert "bool leave()" in transfer
          assert "m_persistentRequestedAtStartup" in transfer
          assert 'm_backend->setProperty("_mobileStudioPresentationActive",false)' in transfer
          assert 'm_backend->setProperty("_mobileStudioCanvasTransferred",true)' in transfer
          assert 'property("_mobileStudioPresentationActive").toBool()' in Path("apply_mobile_shell.py").read_text()
          document_service = Path("mobile_core/document_service.h").read_text()
          switcher = Path("mobile_core/document_switcher.h").read_text()
          assert "MobileMdiViewIdentity::resolve" in document_service
          assert "closeDocumentView(activeView)" in switcher
          assert "activateDocumentView(desiredView)" in switcher
          assert "selected>=0" in document_service
          assert "if(candidate>=0)" in document_service
          mobile_shell = Path("mobile_core/standalone_host.h").read_text()
          quick_actions = Path("mobile_core/quick_actions.h").read_text()
          assert "m_engine.closeActiveDocument()" not in mobile_shell
          assert "closeDocumentView(document.nativeView)" in mobile_shell
          assert 'id==QStringLiteral("mobile:close")' in quick_actions
          assert "m_transfer.leave()" in Path("mobile_core/canvas_session.h").read_text()
          assert "MobileStudio/fingerContactPressureV1" in Path("mobile_core/standalone_host.h").read_text()
          pressure_settings = Path("mobile_core/finger_pressure_settings.h").read_text()
          assert "minPressure() {return 0.0;}" in pressure_settings
          assert "maxPressure() {return 1.0;}" in pressure_settings
          pressure_input = Path("mobile_core/finger_contact_pressure.h").read_text()
          assert "MobileFingerPressureSettings::mapDiameter(" in pressure_input
          assert "stroke.smoothed=target;" in pressure_input
          assert "finger_pressure_settings.h" in pressure_input
          native_chrome = Path("mobile_core/native_canvas_chrome.h").read_text()
          assert "class MobileNativeCanvasChrome" in native_chrome
          assert "m_backend->centralWidget()==m_nativeCanvas" in native_chrome
          assert "takeCentralWidget(" not in native_chrome
          assert "setCentralWidget(" not in native_chrome
          assert "m_nativeCanvas->setParent(" not in native_chrome
          assert "Qt::RightDockWidgetArea" in native_chrome
          pilot = Path("mobile_core/native_canvas_pilot.h").read_text()
          for component in ("MobileNativeCanvasChrome", "MobileQuickActions",
                            "KritaMobileBrushWorkspace", "KritaMobileLayersPanel",
                            "MobileColorWorkspace", "MobileDocumentSwitcher"):
              assert component in pilot, f"Native stationary pilot missing {component}"
          assert "setCentralWidget(" not in pilot
          assert "takeCentralWidget(" not in pilot
          assert "m_nativeCanvas->setParent(" not in pilot
          session = Path("mobile_core/canvas_session.h").read_text()
          assert '#include "native_canvas_pilot.h"' in session
          assert "new MobileNativeCanvasPilot" not in session
          print("Canvas ownership, disabled stationary pilot and finger pressure invariants intact")
          PY

  qt-canvas-host-test:
    # This runs the real Qt-only transfer code offscreen on Linux.
    # No Krita engine, Android emulator, APK, or publishing credentials.
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets development headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qtbase5-dev pkg-config
      - name: Build Qt-only canvas transfer smoke test
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_canvas_transfer_smoke.cpp \
            -o /tmp/krita-canvas-transfer-smoke \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Exercise native canvas handoffs offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-canvas-transfer-smoke
      - name: Build no-reparent mobile chrome smoke test
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_native_canvas_chrome.cpp \
            -o /tmp/krita-native-canvas-chrome-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify 25 chrome-only mode switches without canvas movement
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-native-canvas-chrome-test
      - name: Build guarded MDI view identity test
        run: |
          c++ -std=c++17 -fPIC -I. \
            tests/qt_mdi_view_identity.cpp \
            -o /tmp/krita-mdi-identity-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify document view identity under reordering and deletion
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-mdi-identity-test
      - name: Build optional finger pressure mapping test
        run: |
          c++ -std=c++17 -fPIC -I. \
            tests/qt_finger_contact_pressure.cpp \
            -o /tmp/krita-finger-area-pressure-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify finger mapping, smoothing and original-pressure fallback
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-finger-area-pressure-test
      - name: Build min/max finger calibration dialog smoke test
        run: |
          c++ -std=c++17 -fPIC -I. \
            tests/qt_finger_pressure_calibration.cpp \
            -o /tmp/krita-finger-calibration-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Check calibration ranges and persistence offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-finger-calibration-test
