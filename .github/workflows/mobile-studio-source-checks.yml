          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_mobile_startup_policy.cpp \
            -o /tmp/krita-mobile-startup-test \
            $(pkg-config --cflags --libs Qt5Core)
      - name: Verify mobile-first launch, opt-out and crash recovery
        run: /tmp/krita-mobile-startup-test
      - name: Build embedded single-native-window host regression
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_embedded_native_host.cpp \
            -o /tmp/krita-embedded-host-test \
