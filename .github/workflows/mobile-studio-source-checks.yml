  qt-canvas-host-test:
    # This runs the real Qt-only transfer code offscreen on Linux.
    # No Krita engine, Android emulator, APK, or publishing credentials.
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets development headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qtbase5-dev pkg-config
      - name: Build Qt-only canvas transfer smoke test
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_canvas_transfer_smoke.cpp \
            -o /tmp/krita-canvas-transfer-smoke \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Exercise native canvas handoffs offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-canvas-transfer-smoke
      - name: Compile canvas handoffs without a desktop MDI document stack
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_widget_document_root.cpp \
            -o /tmp/krita-widget-document-root-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify native canvas identity with generic QWidget document root
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-widget-document-root-test
      - name: Build independent lightweight Qt painting canvas host
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_lightweight_canvas_host.cpp \
            -o /tmp/krita-lightweight-canvas-host-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Test independent host lifecycle without desktop Krita
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-lightweight-canvas-host-test
      - name: Compile native Krita close-time Save host Qt test
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_native_krita_save_host.cpp \
            -o /tmp/krita-native-save-host-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Test guarded close-time Save delegation
        run: /tmp/krita-native-save-host-test
      - name: Compile Android provider URI file-operation regression
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_native_document_path_policy.cpp \
            -o /tmp/krita-native-path-policy-test \
            $(pkg-config --cflags --libs Qt5Core)
      - name: Check SAF URI open and Save As behavior
        run: /tmp/krita-native-path-policy-test
      - name: Build guarded native document rollback Qt regression
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_native_document_rollback.cpp \
            -o /tmp/krita-native-document-rollback-test \
            $(pkg-config --cflags --libs Qt5Core)
      - name: Check destroyed and registered document rollback
        run: /tmp/krita-native-document-rollback-test
      - name: Build independent engine visible controls Qt regression
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_native_command_layout.cpp \
            -o /tmp/krita-native-command-layout-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify visible workspace controls keep original canvas
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-native-command-layout-test
      - name: Build native layer reorder bounds regression
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_native_layer_reorder_policy.cpp \
            -o /tmp/krita-native-layer-reorder-test \
            $(pkg-config --cflags --libs Qt5Core)
      - name: Verify safe layer moves and invalid-selection no-ops
        run: /tmp/krita-native-layer-reorder-test
      - name: Build Qt native bootstrap widget inventory
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_native_bootstrap_audit.cpp \
            -o /tmp/krita-native-boot-audit-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify desktop widget isolation from native controls
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-native-boot-audit-test
      - name: Build engine-only Android Qt root and crash recovery test
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_engine_only_root.cpp \
            -o /tmp/krita-engine-only-root-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify engine-only boot is MDI-free and close is save-safe
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-engine-only-root-test
      - name: Build native engine Qt boot coordinator regression
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_native_boot_coordinator.cpp \
            -o /tmp/krita-native-boot-coordinator-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify MDI-independent startup scheduling and fallback
        env:
