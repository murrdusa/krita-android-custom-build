          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-embedded-host-test
      - name: Build MDI-free native multi-document view host
        run: |
          c++ -std=c++17 -fPIC -g -fsanitize=address -fno-omit-frame-pointer -DKRITA_MOBILE_QT_TEST -I. \
            tests/qt_native_view_stack.cpp \
            -o /tmp/krita-native-view-stack-test \
